name: Check register

# Disabled on push: the check is not stable enough (external links/DOIs/APIs
# time out or rate-limit) and regularly needs manual fixes. Run it manually via
# the Actions tab ("Run workflow") or locally with `make check`.
on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - master

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: codecheckers/register:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: git config --system --add safe.directory /__w/register/register
      - name: Rate before
        run: |
          curl -s -H "Authorization: token $GITHUB_PAT" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit | head -20
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: |
          R -e 'options("R.cache.rootPath" = "/tmp"); codecheck::register_check(); warnings()'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Rate after
        if: always()
        run: |
          curl -s -H "Authorization: token $GITHUB_PAT" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit | head -20
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
