name: Render register

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      register: ${{ steps.filter.outputs.register }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check
        # https://github.com/dorny/paths-filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            register:
              - 'register.csv'
              - 'venues.csv'
              # read before Wikidata is queried, so a hand-edited QID changes
              # the rendered person pages; the render writes it back, which can
              # trigger one further (then no-op) run
              - 'persons.csv'
              - '.github/workflows/render.yml'
  render:
    needs: changes
    # the paths filter has no diff to work from on a manual run, so it would
    # skip the render; "Run workflow" must always mean run it - that is also
    # the only way to re-render after a codecheck package change, which touches
    # no file in this repository
    if: ${{ needs.changes.outputs.register == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: codecheckers/register:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: git config --system --add safe.directory /__w/register/register
      - name: Rate before
        run: |
          curl -s -H "Authorization: token $GITHUB_PAT" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit | head -20
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Render
        run: |
          R -e 'options("R.cache.rootPath" = "/tmp"); codecheck::register_render(); warnings()'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Rate after
        if: always()
        run: |
          curl -s -H "Authorization: token $GITHUB_PAT" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit | head -20
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Update register
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: CODECHECK bot <daniel.nuest@tu-dresden.de>
          commit_message: Update register renderings
