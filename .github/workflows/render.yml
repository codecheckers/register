name: Render register

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  changes:
    # forks (e.g. nuest/register) push the same commits as upstream, so a
    # push render there only repeats upstream's; a manual run still works
    if: ${{ github.repository == 'codecheckers/register' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      register: ${{ steps.filter.outputs.register }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check
        # https://github.com/dorny/paths-filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            register:
              - 'register.csv'
              - 'venues.csv'
              # read before Wikidata is queried, so a hand-edited QID changes
              # the rendered person pages; the render writes it back, which can
              # trigger one further (then no-op) run
              - 'persons.csv'
              - '.github/workflows/render.yml'
  render:
    needs: changes
    # the paths filter has no diff to work from on a manual run, so it would
    # skip the render; "Run workflow" must always mean run it - that is also
    # the only way to re-render after a codecheck package change, which touches
    # no file in this repository
    if: ${{ needs.changes.outputs.register == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: codecheckers/register:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: git config --system --add safe.directory /__w/register/register
      - name: Rate before
        run: |
          curl -s -H "Authorization: token $GITHUB_PAT" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit | head -20
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Render
        # register_render() fails when a lookup of a remote resource failed, as
        # during an OSF outage, which would otherwise commit a register that
        # lacks data the previous rendering had. A second try waits for the
        # service and reuses the cache in /tmp from the first, so it asks again
        # only for what failed; if it fails too, nothing is committed.
        run: |
          for attempt in 1 2; do
            if R -e 'options("R.cache.rootPath" = "/tmp"); codecheck::register_render(); warnings()'; then
              exit 0
            fi
            if [ "$attempt" = 1 ]; then
              echo "::warning::The rendering is incomplete, trying again in 15 minutes"
              sleep 900
            fi
          done
          echo "::error::The rendering is incomplete twice, nothing is committed"
          exit 1
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for stray render files
        # temporary page inputs or page-local libs/ must not be committed
        run: ./test/stray_files.sh
      - name: Skip whitespace-only changes
        # a new pandoc in the image re-wraps every page, commit only real changes
        run: ./test/revert_whitespace_only.sh docs
      - name: Rate after
        if: always()
        run: |
          curl -s -H "Authorization: token $GITHUB_PAT" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit | head -20
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Update register
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: CODECHECK bot <daniel.nuest@tu-dresden.de>
          commit_message: Update register renderings
