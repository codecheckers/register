server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors GitHub Pages: a missing path is served docs/404.html rather
    # than nginx's own default 404, so a local `make serve` actually
    # exercises the register's branded, path-aware 404 page (see
    # generate_404_page()) instead of hiding it until deploy.
    error_page 404 /404.html;
}
